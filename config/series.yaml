# Ortsunabhängige Eventserien (Wanderevents): Der Austragungsort wechselt von Jahr zu Jahr.
# Jeder Termin hängt an der Location des jeweiligen Austragungsorts (location: <ort>, series: <id>);
# die Regionsregeln gelten je Jahr für diesen Ort. Serien-IDs sind repo-weit eindeutig.
# Siehe doc/spec.md, „Ortsunabhängige Serien“.
series:
- id: hessentag
  name: Hessentag
  calendar: events
  category: grossevent
  major: true
  scope: Hessen
