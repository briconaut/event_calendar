status_note: 'Geschätzt aus Muster: Mainfest Fr-Mo, Abschlussfeuerwerk jeweils am Montagabend, traditionell zwischen 22 und 23 Uhr (2025: Fr 01.08.-Mo 04.08.; 2026: Fr 31.07.-Mo 03.08.; 2024 laut Presse Fr 02.08.-Mo 05.08.). Montage jeweils der erste Montag im August -> Mo 02.08.2027. Alternativ wäre Mo 09.08.2027 denkbar. Kein Termin 2027 veröffentlicht. Genaue Abschussstelle in den Quellen nicht genannt.'
